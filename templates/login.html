<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .error {
            margin-top: 15px;
            padding: 10px;

            background: #fee2e2;
            color: #dc2626;

            border-radius: 7px;
        }

        .home {
            display: block;
            margin-top: 20px;

            text-decoration: none;
            color: #4f46e5;
        }

        .footer {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">
            🔐
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Fake Account Detection System
        </p>

        <form method="POST" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <a href="/" class="home">
            ← Back to Home
        </a>

        <div class="footer">
            AI-Based Fake Social Media Account Detection System
        </div>

    </div>

</body>

</html>
